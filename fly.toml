# One machine, no volume, no database. The image is the whole deployment.

app = "fleet-management-system"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  processes = ["app"]

  # The console holds a WebSocket open, which counts as an active connection, so a machine
  # only stops once nobody is watching. A scratch Go binary starts in well under a second,
  # so the first visitor after an idle period waits for the machine, not for the app.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
